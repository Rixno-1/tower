name: Build Tower iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Tower.app for iOS Device
        run: |
          mkdir -p build/output
          set -o pipefail
          xcodebuild build \
            -project Tower.xcodeproj \
            -scheme Tower \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/output" \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Inspect Build Log On Failure
        if: failure()
        run: |
          echo "=== Top 50 Error Lines from Build Log ==="
          grep -i -E "error:|fatal error:|\*\* BUILD FAILED \*\*" build/xcodebuild.log -A 2 -B 2 | head -n 100 || true
          echo "=== Last 100 lines of log ==="
          tail -n 100 build/xcodebuild.log || true
      - name: Package unsigned IPA
        run: |
          APP_PATH="build/output/Tower.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Searching for Tower.app..."
            APP_PATH=$(find build -name "Tower.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: Tower.app not found in build output!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qr Tower.ipa Payload
          cd ../..
          ls -lh build/ipa/Tower.ipa
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tower-iOS-IPA
          path: build/ipa/Tower.ipa
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ipa/Tower.ipa
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
