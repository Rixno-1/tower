name: Build Tower iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          # 查看当前可用的 Xcode 版本
          ls -d /Applications/Xcode* || true
          # 优先使用带完整 iOS SDK 的稳定版 Xcode
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Tower.app for iOS Device
        run: |
          mkdir -p build/output
          xcodebuild build \
            -project Tower.xcodeproj \
            -scheme Tower \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/output" \
            clean build
      - name: Package unsigned IPA
        run: |
          APP_PATH="build/output/Tower.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Searching for Tower.app..."
            APP_PATH=$(find build -name "Tower.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: Tower.app not found in build output!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qr Tower.ipa Payload
          cd ../..
          ls -lh build/ipa/Tower.ipa
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tower-iOS-IPA
          path: build/ipa/Tower.ipa
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ipa/Tower.ipa
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
